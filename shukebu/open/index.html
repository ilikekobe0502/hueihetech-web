<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>開啟熟客簿</title>
<meta name="robots" content="noindex">
<style>
:root{--brand:#0d9488;--ink:#0f172a;--muted:#64748b;--border:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#f8fafc;color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px 16px}
.card{max-width:360px;width:100%;background:#fff;border:1px solid var(--border);border-radius:20px;padding:32px 24px;text-align:center}
.logo{width:72px;height:72px;border-radius:20px;margin:0 auto 14px;display:block}
h1{font-size:20px;margin:0 0 6px;letter-spacing:-.3px}
p{font-size:13.5px;color:var(--muted);line-height:1.6;margin:0 0 20px}
.btn{display:block;width:100%;padding:13px 0;border-radius:13px;background:var(--brand);color:#fff;font-size:15px;font-weight:700;text-decoration:none;margin-bottom:14px}
.stores{display:flex;gap:10px;justify-content:center}
.stores a{flex:1;padding:11px 0;border:1px solid var(--border);border-radius:12px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;background:#fff}
.hint{font-size:11.5px;color:#94a3b8;margin-top:16px;margin-bottom:0}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="../../assets/shukebu-icon.png" alt="熟客簿">
  <h1>開啟熟客簿</h1>
  <p>正在為你開啟 App…<br>如果沒有反應，點下方按鈕。</p>
  <a class="btn" id="open" href="veloce://">開啟 App</a>
  <div class="stores">
    <a href="https://apps.apple.com/app/id6811958084">App Store</a>
    <a href="https://play.google.com/store/apps/details?id=com.hueihetech.veloce">Google Play</a>
  </div>
  <p class="hint">還沒安裝？從上方商店免費下載，14 天 PRO 試用。</p>
</div>
<script>
(function(){
  var c = new URLSearchParams(location.search).get('c');
  var deep = c && /^[A-Za-z0-9-]+$/.test(c) ? 'veloce://clients/' + c : 'veloce://';
  document.getElementById('open').setAttribute('href', deep);
  // 自動嘗試一次深連結（LINE 內建瀏覽器/系統瀏覽器皆適用；沒裝 App 則停留本頁）
  setTimeout(function(){ location.href = deep; }, 300);
})();
</script>
</body>
</html>
